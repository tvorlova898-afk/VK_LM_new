<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Что сейчас поможет вашему бизнесу?</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="container">
        <div class="quiz-card">
            <div id="start-screen">
                <h1 id="app-title"></h1>
                <p id="app-subtitle"></p>
                <button class="btn btn-primary" onclick="startQuiz()">Начать</button>
            </div>

            <div id="question-container" style="display: none;">
                <h2 id="question-text"></h2>
                <div id="answers-container"></div>
                <div class="progress-bar">
                    <div id="progress"></div>
                </div>
            </div>

            <div id="result-container" style="display: none;">
                <h2 id="result-title"></h2>
                <p id="result-text"></p>
                <div class="buttons">
                    <button class="btn btn-primary" id="btn-chat"></button>
                    <button class="btn btn-secondary" id="btn-subscribe"></button>
                    <button class="btn btn-text" onclick="restartQuiz()">Пройти заново</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Всплывающее окно с политикой -->
    <div id="policy-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Подписка на полезные материалы</h3>
            <p class="modal-text">Чтобы получать рассылку, нам необходимо обработать ваши данные. Пожалуйста, подтвердите согласие.</p>
            
            <!-- Сюда потом вставишь ссылку на свой документ с политикой вместо решётки # -->
            <a href="#" class="policy-link" target="_blank">Политика в отношении обработки персональных данных</a>
            
            <label class="checkbox-container">
                <input type="checkbox" id="policy-checkbox">
                <span class="checkbox-text">Я принимаю условия политики и даю согласие на обработку персональных данных</span>
            </label>

            <div class="modal-buttons">
                <button class="btn btn-text" onclick="closeModal()">Отмена</button>
                <button class="btn btn-primary" id="btn-confirm-subscribe" disabled>Перейти к боту</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
